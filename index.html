<style>
:root{--blue:#3f87c9;--blue2:#2e6da4;--head:#eaf3fb;--line:#d5e3f0;--ok:#2fa06a;--bg:#eef2f7;--txt:#2b3a4a;--mut:#8ba0b5}
*{box-sizing:border-box;margin:0}
body{font-family:"Malgun Gothic","微软雅黑","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--txt)}
header{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px}

.dot{width:9px;height:9px;border-radius:50%;background:#c4cfd9;display:inline-block;margin-right:5px}

.usr{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}

main{max-width:1020px;margin:0 auto;padding:16px}
.ov{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.btn.on{background:var(--head);border-color:var(--blue);color:var(--blue2);font-weight:700}
.btn.danger{color:#c0564f;border-color:#e5c6c2}
.stat{font-size:13px;color:var(--mut);white-space:nowrap}
.stat b{color:var(--blue2);font-size:15px}
.unit{background:#fff;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(40,60,90,.07);overflow:hidden}
.uh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.uh .chev{color:#9fb4c9;font-size:12px;transition:transform .15s}
.unit.open .uh .chev{transform:rotate(90deg)}
.ut{font-size:16px;font-weight:800;color:var(--blue2)}
.us{font-size:12px;color:var(--mut)}
.ubadge{margin-left:auto;font-size:12px;color:#fff;background:#9db8d2;border-radius:12px;padding:3px 10px;white-space:nowrap}
.ubadge.some{background:var(--ok)}
.ubadge.full{background:#2fa06a}
.ubody{display:none;border-top:1px solid var(--line)}
.unit.open .ubody{display:block}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{background:var(--head);color:#3a6a99;padding:7px 8px;text-align:left;font-size:12.5px;position:sticky;top:96px}
td{padding:6px 8px;border-top:1px solid #eaf1f8}
tr:nth-child(even) td{background:#f8fbfe}
td.no{color:#a8bbcd;width:40px;text-align:center}
td.ko{font-weight:700}
td.zh{color:#41566b}
td.st{width:46px;text-align:center}
.tick{display:inline-block;width:26px;height:26px;line-height:24px;border:1.5px solid #c2d4e5;border-radius:50%;cursor:pointer;color:transparent;font-size:14px;background:#fff;user-select:none}
.tick.done{background:var(--ok);border-color:var(--ok);color:#fff}
.quiz td.zh{cursor:pointer;position:relative;color:transparent;background:#f0f5fa}
.quiz td.zh::after{content:"点击显示";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#9fb4c9}
.quiz td.zh.rv{color:var(--txt);background:#fdf8ec}
.quiz td.zh.rv::after{content:none}
tr.hit td{background:#fff8e6}
.empty{padding:30px;text-align:center;color:var(--mut);font-size:14px}
footer{text-align:center;color:#a5b6c6;font-size:12px;padding:10px 0 30px}
.pbooks{margin-bottom:6px}
.pbooks a{color:#5b9bd5;text-decoration:none;margin:0 5px}
.pbooks a:hover{text-decoration:underline}
#bsz{margin-top:6px;color:#b6c6d6}
@media(max-width:640px){main{padding:10px}table{font-size:13px}th{position:static}h1{font-size:16px}}
@media print{header,.ctl,.tabs,footer,.ov{display:none}.unit{page-break-after:always;box-shadow:none}.ubody{display:block!important}.tick.done{color:#fff}}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const DATA=JSON.parse($('#wd').textContent).books;
let user=localStorage.getItem('wb-user')||'我';
let cur=+(localStorage.getItem('wb-book')||1);
let server=false, quiz=false, timer=null;
let P=JSON.parse(localStorage.getItem('wb-p-'+user)||'{}');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const doneIn=b=>Object.keys(P).filter(k=>k.startsWith(b+'-')).length;
const isOn=k=>!!P[k];

function loadServer(){
  const ctl=new AbortController(); setTimeout(()=>ctl.abort(),1500);
  fetch('/api/progress',{signal:ctl.signal}).then(r=>r.ok?r.json():Promise.reject())
    .then(j=>{server=true;$('#sdot').classList.add('on');
      $('#status').lastChild.textContent=' 已连接 · 进度实时保存';
      if(j[user]){P=Object.assign({},P,j[user]);saveLocal();}
      paintCounts();})
    .catch(()=>{$('#status').lastChild.textContent=' 本地模式 · 进度保存在当前浏览器';});
}
function saveLocal(){localStorage.setItem('wb-p-'+user,JSON.stringify(P));}
function push(){if(!server)return;clearTimeout(timer);timer=setTimeout(()=>{
  fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user:user,words:P})}).catch(()=>{});},700);}

function ovCard(n){const b=DATA[n],d=doneIn(n),p=Math.round(d/b.total*100);
  return `<div class="ovc${n===cur?' cur':''}" data-b="${n}"><b>第 ${n} 册</b><div class="n">${d} / ${b.total}（${p}%）</div><div class="ovbar"><i style="width:${p}%"></i></div></div>`;}
function tabsHtml(){let h='';for(let n=1;n<=6;n++)h+=`<div class="tab${n===cur?' cur':''}" data-b="${n}">第${n}册</div>`;return h;}
function unitHtml(u,bi){
  const ws=u.words, d=ws.filter(w=>isOn(bi+'-'+w[2])).length;
  let rows='';
  for(let i=0;i<ws.length;i++){const w=ws[i];
    rows+=`<tr data-k="${bi}-${w[2]}"><td class="no">${i+1}</td><td class="ko">${esc(w[0])}</td><td class="zh">${esc(w[1])}</td><td class="st"><span class="tick${isOn(bi+'-'+w[2])?' done':''}">✓</span></td></tr>`;}
  return `<div class="unit${(typeof unitOpen[bi]==='undefined'?bi===1:unitOpen[bi])?' open':''}" data-u="${bi}">
    <div class="uh"><span class="chev">▶</span><span class="ut">第 ${bi} 课 · ${esc(u.ko)} ${u.zh}</span><span class="us">제${bi}과</span><span class="ubadge">已背 ${d} / ${ws.length}</span></div>
    <div class="ubody"><table><thead><tr><th style="width:40px;text-align:center">#</th><th>韩文</th><th>中文</th><th style="width:46px;text-align:center">✓</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
let unitOpen={};

function renderBook(){
  const b=DATA[cur], host=$('#units');
  host.innerHTML=b.units.map((u,i)=>unitHtml(u,i+1)).join('');
  if(!Object.values(host.querySelectorAll('.unit')).some(x=>x.classList.contains('open')))
    host.querySelector('.unit').classList.add('open');
  applySearch();paintCounts();
}
function paintCounts(){
  $('#ov').innerHTML=[1,2,3,4,5,6].map(ovCard).join('');
  $('#tabs').innerHTML=tabsHtml();
  const b=DATA[cur],d=doneIn(cur);
  $('#stat').innerHTML=`本册 <b>${d}</b> / ${b.total}（${Math.round(d/b.total*100)}%）`;
  $('#tot').textContent=[1,2,3,4,5,6].reduce((s,n)=>s+DATA[n].total,0);
  b.units.forEach((u,i)=>{const el=$(`#units .unit[data-u="${i+1}"]`);if(!el)return;
    const ws=u.words,dd=ws.filter(w=>isOn(cur+'-'+w[2])).length;
    const bd=el.querySelector('.ubadge');
    bd.textContent=`已背 ${dd} / ${ws.length}`;
    bd.className='ubadge'+(dd===ws.length?' full':dd?' some':'');});
}
function applySearch(){
  const q=$('#q').value.trim().toLowerCase();
  document.querySelectorAll('#units .unit').forEach(el=>{
    let n=0;
    el.querySelectorAll('tbody tr').forEach(tr=>{
      const hit=!q||tr.textContent.toLowerCase().includes(q);
      tr.style.display=hit?'':'none';tr.classList.toggle('hit',!!q&&hit);
      if(hit)n++;});
    el.style.display=n?'':'none';
    if(q&&n)el.classList.add('open');});
}
function bind(){
  $('#ov').onclick=e=>{const c=e.target.closest('.ovc');if(c){cur=+c.dataset.b;localStorage.setItem('wb-book',cur);unitOpen={};renderBook();}};
  $('#tabs').onclick=e=>{const t=e.target.closest('.tab');if(t){cur=+t.dataset.b;localStorage.setItem('wb-book',cur);unitOpen={};renderBook();}};
  $('#units').onclick=e=>{
    const uh=e.target.closest('.uh');
    if(uh){const u=uh.parentElement;unitOpen[+u.dataset.u]=!u.classList.contains('open');u.classList.toggle('open');return;}
    const tk=e.target.closest('.tick');
    if(tk){const tr=tk.closest('tr'),k=tr.dataset.k;
      if(P[k])delete P[k];else P[k]=1;
      tk.classList.toggle('done');saveLocal();push();paintCounts();return;}
    const zh=e.target.closest('.td,.zh')&&e.target.closest('td.zh');
    if(zh&&quiz)zh.classList.toggle('rv');};
  $('#q').oninput=applySearch;
  $('#quizb').onclick=()=>{quiz=!quiz;$('#quizb').classList.toggle('on',quiz);
    document.body.classList.toggle('quiz',quiz);
    document.querySelectorAll('td.zh').forEach(c=>c.classList.remove('rv'));};
  $('#exp').onclick=()=>{const us=[...document.querySelectorAll('#units .unit')];
    const anyClosed=us.some(u=>!u.classList.contains('open'));
    us.forEach(u=>{u.classList.toggle('open',anyClosed);unitOpen[+u.dataset.u]=anyClosed;});};
  $('#reset').onclick=()=>{const b=DATA[cur];
    if(!confirm(`确定清空「第 ${cur} 册」的全部打卡记录吗？（${doneIn(cur)} 条）`))return;
    Object.keys(P).forEach(k=>{if(k.startsWith(cur+'-'))delete P[k];});
    saveLocal();push();renderBook();};
  const ui=$('#user');ui.value=user;
  ui.onchange=()=>{user=ui.value.trim()||'我';localStorage.setItem('wb-user',user);
    P=JSON.parse(localStorage.getItem('wb-p-'+user)||'{}');
    if(server)fetch('/api/progress').then(r=>r.json()).then(j=>{
      if(j[user])P=Object.assign({},P,j[user]);renderBook();}).catch(()=>{});
    else renderBook();};
}
bind();renderBook();loadServer();
</script>
